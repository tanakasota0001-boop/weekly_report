company:
  name: Pilot Mieux（中小企業伴走支援コンサルティング）
  url: https://www.pilotmieux.com/
  notes: '【サービス概要】

    中小企業の経営課題に伴走し、現場目線での業務改善からAI・DX・データ活用までを一気通貫で支援するコンサルティングファーム。


    【ターゲット顧客】

    DXやAI導入に課題感を持ちつつも、社内に専門人材が不足している中小・中堅企業の経営層。


    【保有アセット・独自の強み】

    ・代表の人的ネットワークおよび高い課題特定力

    ・難解な最新技術（生成AI・DX・データ分析）を中小企業の実務レベルに噛み砕き、定着まで落とし込める実践的な専門性


    【今後の注力テーマ】

    ・代表個人のリファラル営業からの脱却と、体系化されたマーケティング＆セールス導線の確立

    ・支援実績のコンテンツ化・ホワイトペーパー化によるオーガニックリードの獲得

    ・再現性の高い伴走パッケージ（AI・DX導入支援）の型化とパートナー協業の拡大'
  current_challenges:
    focus_kpi: リファラル依存脱却に向けた「自社経由の新規有効リード月間5件獲得」および「提案成約率25%以上の維持」
    urgent_issues:
    - 代表の人脈・紹介に過度に依存しており、将来的な売上予測が立てにくい営業パイプラインの脆弱性
    - 「中小企業向けAI・DX伴走」という強みがウェブ上で言語化・訴求しきれておらず、問い合わせにつながる導線（コンテンツ・セミナー等）が未構築
    - コンサルティング業務の遂行と新規営業の両立が困難で、代表のリソースがボトルネック化していること
