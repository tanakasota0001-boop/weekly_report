# ==========================================
# 事業開発AIエージェント 設定ファイル
# ==========================================

# 1. 自社・ユーザープロファイル設定
company:
  # 会社名・事業部名（任意）
  name: "事業開発部"

  # 自社ホームページURL
  # ※指定するとエージェントが自動でWebサイトを読み込み、自社の強みやターゲットをプロファイリングします
  url: "https://example.com"

  # 自由記述指示・補足情報
  # ※自社の強み、保有アセット（顧客基盤、営業網、技術など）、注力したい関心領域を記載してください
  notes: |
    私たちは社内の事業開発部です。
    特にBtoB向けのDX、生成AI・LLMを活用した業務効率化や新規SaaS事業に関心があります。
    既存の企業顧客基盤やパートナー網を活かして、高い付加価値を提供できるビジネスモデルを模索しています。

# 2. ニュース収集設定
news:
  # 収集対象のキーワード（Google News RSS等で検索）
  keywords:
    - "生成AI ビジネス"
    - "DX 業務改革"
    - "AI スタートアップ 資金調達"
    - "IT 業界 課題"
  
  # 1回の実行で収集する最大記事数
  max_articles_to_collect: 25

  # スクリーニング後に詳細レポートを作成する上位記事数
  top_articles_to_report: 3

# 3. 通知・出力設定
notification:
  # Teamsへ送信するかどうか (true/false)
  send_to_teams: true
  
  # ローカルの reports/ フォルダにMarkdownファイルを保存するかどうか
  save_markdown_locally: true

# 4. モデル設定
model:
  # 利用するGeminiモデル (無料枠あり)
  # gemini-2.5-flash または gemini-1.5-flash
  name: "gemini-2.5-flash"
